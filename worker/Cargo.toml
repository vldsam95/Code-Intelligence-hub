[workspace]
members = [
  "crates/codeintel-core",
  "crates/codeintel-graph",
  "crates/codeintel-indexer",
  "crates/codeintel-semantic",
  "crates/codeintel-frameworks",
  "crates/codeintel-runtime",
  "crates/codeintel-review",
  "crates/codeintel-quality",
  "crates/codeintel-worker",
  "crates/codeintel-mcp",
  "crates/codeintel-cli",
]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1.0.79"
chrono = { version = "0.4.31", features = ["serde"] }
clap = { version = "4.4.18", features = ["derive", "env"] }
flate2 = "1.0.28"
fs2 = "0.4.3"
globset = "0.4.14"
hex = "0.4.3"
notify = "6.1.1"
regex = "1.10.3"
reqwest = { version = "0.11.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.30.0", features = ["bundled"] }
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
serde_yaml = "0.9.30"
sha2 = "0.10.8"
tempfile = "3.9.0"
thiserror = "1.0.56"
tree-sitter = "0.20.10"
tree-sitter-c-sharp = "0.20.0"
tree-sitter-javascript = "0.20.4"
tree-sitter-php = "0.20.0"
tree-sitter-python = "0.20.4"
tree-sitter-rust = "0.20.4"
tree-sitter-typescript = "0.20.5"
uuid = { version = "1.6.1", features = ["v4", "serde"] }
walkdir = "2.4.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
